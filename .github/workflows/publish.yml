name: Publish to PyPI

# Publishing is triggered ONLY by a published GitHub Release. (workflow_dispatch
# was removed deliberately: this job holds id-token: write for PyPI Trusted
# Publishing, so the trigger surface is kept as small as possible.)
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Gate the release on a green test run so a broken build can never publish to
  # PyPI (the publish job holds id-token: write). Mirrors ci.yml's Alpine/musl
  # test job - the same libc the target runtime uses.
  test:
    name: Unit tests (Alpine / musl)
    runs-on: ubuntu-latest
    container: python:3.13-alpine
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (node24)
      # Keep this job's install + invocation IDENTICAL to ci.yml's test job, so
      # "the tests that gate publish" and "the tests that run in CI" can never
      # quietly diverge (they had: pytest-asyncio here vs pytest-cov there).
      - name: System deps
        run: apk add --no-cache git ffmpeg gcc musl-dev libffi-dev
      - name: Install package + test deps
        run: pip install -e ".[webrtc]" pytest pytest-cov pytest-asyncio pyflakes
      - name: Run tests
        run: pytest tests/ -q -m "not e2e and not live" --ignore=tests/e2e --cov=aidot_cameras --cov-report=term-missing

  # Releases must be validated against REAL cameras before they reach PyPI.
  #
  # The cameras run in a PRIVATE repo (python-aidot-cameras-ci), because Actions
  # logs on a public repository are world-readable and a live run prints the
  # camera inventory - names, models, device ids. That run reports back here as a
  # commit status on the sha it validated, and this job just reads it.
  #
  # Direction matters: the private repo reports IN, rather than this job reaching
  # OUT. Polling the private repo would need a token that can read a private repo
  # stored as a secret in a public one. This way this job needs no credential at
  # all - GITHUB_TOKEN reads statuses on its own repo - and the only token in
  # play is scoped to commit statuses on this already-public repo and lives in
  # the private repo.
  #
  # Fails closed: no status, a failure status, a status on a different sha, or a
  # private run that never reports all block the publish. A runner that is simply
  # switched off blocks it too - that is deliberate, an unvalidated release is
  # exactly what this exists to prevent.
  live-gate:
    name: Require green live validation
    runs-on: ubuntu-latest
    permissions:
      statuses: read
      contents: read
    steps:
      - name: Emergency override check
        id: override
        env:
          OVERRIDE_SHA: ${{ vars.LIVE_GATE_OVERRIDE_SHA }}
        run: |
          # The override is a repo VARIABLE that must equal this exact commit.
          # Admin-only to set, visible in the audit log, and single-use by
          # construction (the next release has a different SHA). See
          # docs/CI-RUNNER.md for when this is legitimate.
          if [ -n "${OVERRIDE_SHA}" ] && [ "${OVERRIDE_SHA}" = "${GITHUB_SHA}" ]; then
            echo "::warning::LIVE GATE OVERRIDDEN for ${GITHUB_SHA} - publishing WITHOUT live camera validation"
            echo "overridden=true" >> "$GITHUB_OUTPUT"
          else
            echo "overridden=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the live-validation status on this commit
        if: steps.override.outputs.overridden != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Two different waits, because "validation is running" and "nobody
          # started any" deserve very different patience.
          #
          # The private run posts a `pending` status the moment it starts, so a
          # missing status means nothing ever claimed this commit. That is a
          # mistake, not slowness - fail in minutes rather than stalling.
          #
          # Once pending, be generous: a full fleet run measured 45.5 min on
          # 2026-08-01 (7 cameras, per-camera cooldowns, two flat batteries and a
          # powered-off unit). The old flat 40 min was SHORTER than that, so a
          # perfectly good release could have been blocked by the gate giving up
          # first. This must exceed the private job's own 55 min timeout,
          # otherwise the gate stops watching before the job can even fail.
          GRACE=$(( 3*60 ))       # to see any status at all
          PATIENT=$(( 60*60 ))    # once we know a run is in flight
          grace_deadline=$(( SECONDS + GRACE ))
          deadline=$(( SECONDS + PATIENT ))
          seen_pending=0
          while [ $SECONDS -lt $deadline ]; do
            # Exact context only. A filtered/partial run posts a DIFFERENT
            # context on purpose, so a subset validation can never satisfy this.
            state=$(gh api "repos/${REPO}/commits/${SHA}/statuses" \
              --jq 'map(select(.context == "live-validation")) | first | .state // "none"' 2>/dev/null || echo "none")

            case "$state" in
              success)
                echo "live validation succeeded for ${SHA}"
                exit 0 ;;
              failure|error)
                echo "::error::live validation reported ${state} for ${SHA}"
                exit 1 ;;
              pending)
                if [ "$seen_pending" -eq 0 ]; then
                  seen_pending=1
                  echo "live validation is running for ${SHA} - waiting up to $((PATIENT/60))m"
                fi ;;
              *)
                # Nothing has claimed this commit. Give it a short grace in case
                # the private run is still spinning up, then stop guessing.
                if [ $SECONDS -ge $grace_deadline ]; then
                  echo "::error::no live-validation run ever claimed ${SHA} (no status after $((GRACE/60))m)."
                  echo "::error::Trigger live-validate.yml in python-aidot-cameras-ci with lib_ref=${SHA}, then re-run this job."
                  echo "::error::If the LAN runner is offline, bring it up first, or use the documented override in docs/CI-RUNNER.md."
                  exit 1
                fi
                echo "no live-validation status on ${SHA} yet - waiting (grace $((GRACE/60))m)" ;;
            esac
            sleep 30
          done
          echo "::error::timed out waiting for live validation of ${SHA}. Publish blocked."
          echo "::error::If the runner is offline, bring it up and re-run the private live-validate workflow, or use the documented override in docs/CI-RUNNER.md."
          exit 1

  publish:
    name: Build and publish
    needs: [test, live-gate]
    runs-on: ubuntu-latest
    # Trusted Publishing: register this repo + workflow (publish.yml) +
    # environment (pypi) under the python-aidot-cameras project on pypi.org.
    # No API token or secret is needed once that is configured.
    environment: pypi
    permissions:
      id-token: write
    # Third-party actions are pinned to full commit SHAs (not moving tags) so a
    # repointed/compromised tag cannot run in this token-minting job. Dependabot
    # (github-actions ecosystem) keeps these current.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      # Fail fast if the release tag and the packaged version disagree: a
      # mismatch would publish the wrong version, or hard-fail as a PyPI
      # duplicate. Tags are vX.Y.Z; pyproject carries X.Y.Z.
      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')"
          echo "release tag: ${tag}   pyproject: ${proj}"
          if [ "${tag}" != "${proj}" ]; then
            echo "::error::release tag (${tag}) does not match pyproject version (${proj})"
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1 (v1.14.0)
